<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kings&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Irish Template</title>

<style>
.irish-template {
  width: 700px;
  height: 500px;
  margin: auto;
}

.irish-image {
  position: absolute;
  width: 100%;
  height: 100%;
  left: -50%;
  background: url("https://raw.githubusercontent.com/ghettobarbie18/irish/refs/heads/main/odhran4.png") center / cover no-repeat;
}

.irish-textbox {
  position: absolute;
  width: 400px;
  height: 500px;
  left: 80px;
  background: linear-gradient(
        120deg,
        #D3DAD9,
        #715A5A,
        #44444E
    );
  background-size: 200% 200%;
  animation: gradientMove 8s ease infinite;
  border: 2px solid #37353E;
  padding: 20px;
  font-family: georgia;
  font-size: 13px;
  color: white;
}

@keyframes gradientMove {
    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

.irish-title {
  position: absolute;
  width: 100%;
  height: 100%;
  top: calc(50% + 250px);
  left: 0;
  animation: pulse 3s infinite;
  font-family: "Kings", cursive;
  font-weight: 400;
  font-style: normal;
  background: linear-gradient( 
    to right, 
    #FAF0E6, 
    #5C5470, 
    #B9B4C7,
    #FAF0E6
  ); 
  -webkit-background-clip: text; 
  -webkit-text-fill-color: transparent;
  font-size: 40px;
  letter-spacing: 5px;
}

@keyframes pulse {
    0% {
        box-shadow: 0 0 5px #61677A;
    }

    50% {
        box-shadow: 0 0 30px #D8D9DA;
    }

    100% {
        box-shadow: 0 0 5px #61677A;
    }
}
</style>
</head>

<body>

<div class="irish-template">
    <div class="irish-image"></div>
    <div class="irish-textbox">text here
    </div>
    <div class="irish-title">Odhrán</div>

</div>

</body>
</html>
